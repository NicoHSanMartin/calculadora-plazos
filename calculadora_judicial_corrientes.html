<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plazos OJ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a3a5c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Calculadora de Plazos – OJ Corrientes</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --azul: #1a3a5c;
  --dorado: #c8a83c;
  --dorado2: #e8c85c;
  --bg: #f0f2f5;
  --blanco: #ffffff;
  --borde: #d1d5db;
  --texto: #1f2937;
  --texto2: #6b7280;
  --amarillo-bg: #fffbeb;
  --amarillo-txt: #92400e;
  --azul-bg: #eff6ff;
  --azul-txt: #1e40af;
  --rojo-bg: #fef2f2;
  --rojo-txt: #b91c1c;
  --lila-bg: #f5f3ff;
  --lila-txt: #5b21b6;
}
html, body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  min-height: 100%;
  color: var(--texto);
  -webkit-font-smoothing: antialiased;
}
.header {
  background: var(--azul);
  padding-top: env(safe-area-inset-top, 0px);
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.header-inner {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px 11px;
}
.logo-wrap {
  width: 52px; height: 52px; flex-shrink: 0;
  background: transparent;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.logo-wrap svg { width: 52px; height: 52px; }
.h-inst { font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.65); text-transform: uppercase; letter-spacing: 0.08em; line-height: 1.4; }
.h-app  { font-size: 15px; font-weight: 700; color: #fff; margin-top: 1px; }
.barra  { height: 3px; background: linear-gradient(90deg, var(--dorado), var(--dorado2), var(--dorado)); }

.main {
  padding: 14px 14px 40px;
  max-width: 500px; margin: 0 auto;
}
.card {
  background: var(--blanco); border-radius: 14px;
  padding: 18px; margin-bottom: 14px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
.card-hd {
  font-size: 11px; font-weight: 700; color: var(--azul);
  text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: 16px; padding-bottom: 10px;
  border-bottom: 1px solid var(--borde);
  display: flex; align-items: center; gap: 8px;
}
.card-hd::before {
  content: ''; width: 4px; height: 14px;
  background: var(--dorado); border-radius: 2px; flex-shrink: 0;
}
.field { margin-bottom: 14px; }
.field:last-child { margin-bottom: 0; }
.field label {
  display: block; font-size: 11px; font-weight: 600;
  color: var(--texto2); text-transform: uppercase;
  letter-spacing: 0.07em; margin-bottom: 6px;
}
.fecha-wrap { position: relative; }
.fecha-display {
  width: 100%; padding: 11px 44px 11px 13px;
  font-size: 16px; font-family: inherit;
  border: 1.5px solid var(--borde); border-radius: 9px;
  background: #f9fafb; color: var(--texto);
  cursor: pointer; user-select: none; -webkit-user-select: none;
  transition: border-color 0.18s;
  min-height: 46px; display: flex; align-items: center;
}
.fecha-display.activo { border-color: var(--azul); background: #fff; }
.icono-cal {
  position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
  font-size: 18px; pointer-events: none;
}

/* Custom calendar popup */
.cal-popup {
  display: none; position: absolute; top: calc(100% + 6px); left: 0; right: 0;
  background: white; border: 1.5px solid var(--azul); border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.18); z-index: 999; overflow: hidden;
}
.cal-popup.open { display: block; }
.cal-nav {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--azul); padding: 10px 12px;
}
.cal-nav button {
  background: none; border: none; color: white; font-size: 18px;
  cursor: pointer; padding: 2px 8px; border-radius: 6px; line-height: 1;
  -webkit-tap-highlight-color: transparent;
}
.cal-nav button:active { background: rgba(255,255,255,0.2); }
.cal-title { color: white; font-weight: 700; font-size: 14px; }
.cal-grid {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 1px; padding: 8px;
}
.cal-dow {
  text-align: center; font-size: 10px; font-weight: 700;
  color: var(--texto2); padding: 4px 0; text-transform: uppercase;
}
.cal-day {
  text-align: center; padding: 8px 2px; border-radius: 8px;
  font-size: 14px; cursor: pointer; color: var(--texto);
  -webkit-tap-highlight-color: transparent;
  transition: background 0.12s;
}
.cal-day:empty { pointer-events: none; }
.cal-day:hover:not(.empty) { background: var(--azul-bg); }
.cal-day.hoy { font-weight: 800; color: var(--azul); background: var(--azul-bg); }
.cal-day.sel { background: var(--azul) !important; color: white !important; border-radius: 8px; }
.cal-day.finde { color: #9ca3af; }
.cal-day.inhabil { background: #fef9ec; color: #b45309; }
.cal-btn-hoy {
  width: 100%; padding: 10px; background: var(--bg); border: none;
  border-top: 1px solid var(--borde); font-size: 13px; font-weight: 600;
  color: var(--azul); cursor: pointer; font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}
.cal-btn-hoy:active { background: var(--azul-bg); }
.field input[type="number"] {
  width: 100%; padding: 11px 13px; font-size: 16px;
  border: 1.5px solid var(--borde); border-radius: 9px;
  background: #f9fafb; color: var(--texto);
  outline: none; -webkit-appearance: none; appearance: none;
  font-family: inherit; transition: border-color 0.18s;
}
.field input[type="number"]:focus { border-color: var(--azul); background: #fff; }
.btn-calc {
  width: 100%; padding: 15px; background: var(--azul);
  color: #fff; font-size: 15px; font-weight: 700;
  border: none; border-radius: 10px; cursor: pointer;
  letter-spacing: 0.02em; margin-top: 2px;
  box-shadow: 0 4px 14px rgba(26,58,92,0.35);
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
  -webkit-appearance: none; appearance: none;
  display: block; text-align: center;
  transition: opacity 0.15s;
}
.btn-calc:active { opacity: 0.82; }

/* RESULTADOS */
.res-grid2 {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  margin-bottom: 14px;
}
.res-col { border-radius: 13px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.res-col-hd { padding: 9px 12px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
.col-habil   .res-col-hd { background: var(--azul); color: var(--dorado2); }
.col-corrido .res-col-hd { background: #374151; color: #d1d5db; }
.res-col-body { background: var(--blanco); padding: 11px 12px 12px; }
.res-fecha-grande { font-size: 16px; font-weight: 700; line-height: 1.3; margin-bottom: 3px; }
.col-habil   .res-fecha-grande { color: var(--azul); }
.col-corrido .res-fecha-grande { color: #374151; }
.res-dia-txt { font-size: 11px; color: var(--texto2); min-height: 16px; }
.res-dias-cnt { margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--borde); font-size: 11px; color: var(--texto2); }
.res-dias-cnt span { font-weight: 700; font-size: 13px; color: var(--texto); }

/* ALERTAS */
.alerta {
  border-radius: 10px; padding: 11px 13px;
  font-size: 13px; line-height: 1.5; margin-bottom: 12px;
  display: flex; gap: 8px; align-items: flex-start;
}
.alerta-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
.alerta.warn  { background: var(--amarillo-bg); color: var(--amarillo-txt); border: 1px solid #fcd34d; }
.alerta.err   { background: var(--rojo-bg);     color: var(--rojo-txt);     border: 1px solid #fca5a5; }
.alerta.local { background: var(--lila-bg);     color: var(--lila-txt);     border: 1px solid #c4b5fd; }

/* DETALLE */
.detalle-card { background: var(--blanco); border-radius: 13px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
.det-hd { font-size: 10px; font-weight: 700; color: var(--texto2); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
.det-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--borde); font-size: 13px; gap: 8px; }
.det-row:last-child { border-bottom: none; padding-bottom: 0; }
.det-nombre { color: var(--texto); flex: 1; }
.det-meta { color: var(--texto2); font-size: 11px; white-space: nowrap; }
.badge { display: inline-block; font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 20px; margin-left: 5px; }
.b-nacional { background: var(--amarillo-bg); color: var(--amarillo-txt); }
.b-nolabor  { background: #fef3c7; color: #78350f; }
.b-feria    { background: var(--azul-bg); color: var(--azul-txt); }

.footer { text-align: center; font-size: 10.5px; color: var(--texto2); padding: 8px 0 2px; line-height: 1.8; opacity: 0.7; }
</style>
</head>

<script>
const MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESES_C = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS_L  = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DIAS_C  = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

// ── FERIADOS QUE CUENTAN COMO INHÁBILES PARA TODOS ───────
// Nacionales (Resol.164/25) + No laborables nacionales
const FERIADOS = [
  // ENERO
  { f:'2026-01-01', n:'Año Nuevo', t:'nacional' },
  // FEBRERO
  { f:'2026-02-16', n:'Carnaval', t:'nacional' },
  { f:'2026-02-17', n:'Carnaval', t:'nacional' },
  // MARZO
  { f:'2026-03-19', n:'Día no laborable', t:'nolabor' },
  { f:'2026-03-24', n:'Memoria, Verdad y Justicia', t:'nacional' },
  // ABRIL
  { f:'2026-04-02', n:'Veteranos de Malvinas / Jueves Santo', t:'nacional' },
  { f:'2026-04-03', n:'Viernes Santo', t:'nacional' },
  // MAYO
  { f:'2026-05-01', n:'Día del Trabajador', t:'nacional' },
  { f:'2026-05-03', n:'Día no laborable', t:'nolabor' },
  { f:'2026-05-25', n:'Revolución de Mayo', t:'nacional' },
  // JUNIO
  { f:'2026-06-15', n:'Gral. Belgrano (trasladado)', t:'nacional' },
  { f:'2026-06-20', n:'Paso a la Inmortalidad Gral. Belgrano', t:'nacional' },
  // JULIO
  { f:'2026-07-09', n:'Día de la Independencia', t:'nacional' },
  // AGOSTO
  { f:'2026-08-17', n:'Gral. San Martín (trasladado)', t:'nacional' },
  // OCTUBRE
  { f:'2026-10-12', n:'Diversidad Cultural', t:'nacional' },
  // NOVIEMBRE
  { f:'2026-11-23', n:'Soberanía Nacional (trasladado)', t:'nacional' },
  // DICIEMBRE
  { f:'2026-12-07', n:'Día no laborable', t:'nolabor' },
  { f:'2026-12-08', n:'Inmaculada Concepción', t:'nacional' },
  { f:'2026-12-25', n:'Navidad', t:'nacional' },
  // CORRIENTES CAPITAL (jurisdiccionales inhábiles)
  { f:'2026-03-23', n:'Feriado jurisdiccional Corrientes', t:'nacional' },
  { f:'2026-07-10', n:'Feriado jurisdiccional Corrientes', t:'nacional' },
  { f:'2026-07-16', n:'Feriado jurisdiccional Corrientes', t:'nacional' },
  { f:'2026-07-27', n:'Compensación feria (feriado 16/07)', t:'nacional' },
  { f:'2026-09-24', n:'Feriado jurisdiccional Corrientes', t:'nacional' },
  { f:'2026-12-07', n:'Feriado jurisdiccional Corrientes', t:'nacional' },
];

// ── FERIADOS LOCALES → solo nota informativa, NO inhábiles ─
// Fuente: Ac.82/23 Cámara Federal Corrientes
const FERIADOS_LOCALES = [
  { f:'2026-09-12', n:'Feriado jurisdiccional', loc:'Goya' },
  { f:'2026-10-07', n:'Feriado jurisdiccional', loc:'Goya' },
];

// ── FERIAS JUDICIALES ────────────────────────────────────
const FERIAS = [
  { desde:'2026-01-01', hasta:'2026-01-31', n:'Feria de Verano' },
  { desde:'2026-07-13', hasta:'2026-07-25', n:'Feria de Invierno' },
];

const F_SET = new Set(FERIADOS.map(x => x.f));

// ── HELPERS ──────────────────────────────────────────────
function pad(n){ return String(n).padStart(2,'0'); }
function ds(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function next(d){ const r=new Date(d); r.setDate(r.getDate()+1); return r; }
function fmt(d){ return pad(d.getDate())+' '+MESES_C[d.getMonth()]+'. '+d.getFullYear(); }

function enFeria(d){
  const s=ds(d);
  return FERIAS.find(f=>s>=f.desde && s<=f.hasta)||null;
}

function esInhabil(d){
  const dow=d.getDay();
  if(dow===0||dow===6) return {t:'finde', n:'Fin de semana'};
  const s=ds(d);
  if(F_SET.has(s)){ const f=FERIADOS.find(x=>x.f===s); return {t:f?f.t:'nacional', n:f?f.n:'Feriado'}; }
  const fe=enFeria(d);
  if(fe) return {t:'feria', n:fe.n};
  return null;
}

// ── FECHA HOY ────────────────────────────────────────────
function todayStr(){
  const h=new Date();
  return h.getFullYear()+'-'+pad(h.getMonth()+1)+'-'+pad(h.getDate());
}

function actualizarDisplay(val){
  const txt=document.getElementById('fechaTexto');
  const disp=document.getElementById('fechaDisplay');
  if(!val){ txt.textContent='Seleccionar fecha...'; disp.classList.remove('activo'); return; }
  const [y,m,d]=val.split('-').map(Number);
  const fecha=new Date(y,m-1,d);
  const label = val===todayStr()
    ? 'Hoy, '+DIAS_L[fecha.getDay()]+' '+pad(d)+' de '+MESES_L[m-1]
    : DIAS_L[fecha.getDay()]+' '+pad(d)+' de '+MESES_L[m-1]+' de '+y;
  txt.textContent=label;
  disp.classList.add('activo');
}

// ── CUSTOM CALENDAR ──────────────────────────────────────
var calCurrentYear, calCurrentMonth, calSelectedVal;

function toggleCal(){
  const popup = document.getElementById('calPopup');
  if(popup.classList.contains('open')){ closeCal(); return; }
  // init to selected date or today
  const base = calSelectedVal || todayStr();
  const [y,m] = base.split('-').map(Number);
  calCurrentYear = y; calCurrentMonth = m;
  renderCal();
  popup.classList.add('open');
}

function closeCal(){
  document.getElementById('calPopup').classList.remove('open');
}

function calMes(delta){
  calCurrentMonth += delta;
  if(calCurrentMonth > 12){ calCurrentMonth = 1; calCurrentYear++; }
  if(calCurrentMonth < 1){ calCurrentMonth = 12; calCurrentYear--; }
  renderCal();
}

function renderCal(){
  const y = calCurrentYear, m = calCurrentMonth;
  document.getElementById('calTitle').textContent = MESES_L[m-1].charAt(0).toUpperCase()+MESES_L[m-1].slice(1)+' '+y;
  const grid = document.getElementById('calGrid');
  const hoy = todayStr();
  // Day headers: L M M J V S D
  const dowLabels = ['Lu','Ma','Mi','Ju','Vi','Sá','Do'];
  let html = dowLabels.map(d=>'<div class="cal-dow">'+d+'</div>').join('');
  // First day of month (0=Sun..6=Sat) → convert to Mon-first
  const firstDay = new Date(y, m-1, 1).getDay(); // 0=Sun
  const firstMon = (firstDay + 6) % 7; // 0=Mon
  const daysInMonth = new Date(y, m, 0).getDate();
  for(let i=0;i<firstMon;i++) html += '<div class="cal-day"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ds2 = y+'-'+pad(m)+'-'+pad(d);
    const dow = new Date(y,m-1,d).getDay();
    const isFinde = dow===0||dow===6;
    const isHoy = ds2===hoy;
    const isSel = ds2===calSelectedVal;
    const isFeriado = F_SET && F_SET.has(ds2);
    let cls = 'cal-day';
    if(isSel) cls+=' sel';
    else if(isHoy) cls+=' hoy';
    else if(isFeriado) cls+=' inhabil';
    else if(isFinde) cls+=' finde';
    html += `<div class="${cls}" onclick="selDia('${ds2}')">${d}</div>`;
  }
  grid.innerHTML = html;
}

function selDia(val){
  calSelectedVal = val;
  document.getElementById('fechaInicio').value = val;
  actualizarDisplay(val);
  closeCal();
  // re-render so selected day highlights
  const [y,m] = val.split('-').map(Number);
  calCurrentYear=y; calCurrentMonth=m;
}

// Close calendar when clicking outside
document.addEventListener('click', function(e){
  const wrap = document.getElementById('fechaWrap');
  if(wrap && !wrap.contains(e.target)) closeCal();
});

function onFechaChange(){
  actualizarDisplay(document.getElementById('fechaInicio').value);
}

window.addEventListener('DOMContentLoaded', function(){
  selDia(todayStr());
});

// ── CÁLCULO ──────────────────────────────────────────────
function calcVenc(base, cant, tipo){
  let actual=new Date(base), cont=0, feriados=[], feriasMap={}, iters=0;
  while(cont<cant && iters<2000){
    iters++;
    const inh=esInhabil(actual);
    // Si es feriado pero cae dentro de feria, tratarlo como día de feria para el conteo
    const fe=enFeria(actual);
    const inhEfectivo = (inh && inh.t!=='finde' && inh.t!=='feria' && fe)
      ? {t:'feria', n:fe.n}
      : inh;
    if(tipo==='h'){
      if(!inhEfectivo){ cont++; }
      else {
        if(inhEfectivo.t==='feria'){ feriasMap[inhEfectivo.n]=(feriasMap[inhEfectivo.n]||0)+1; }
        else if(inhEfectivo.t!=='finde'){ const s=ds(actual); if(!feriados.find(x=>x.f===s)) feriados.push({f:s,n:inhEfectivo.n,t:inhEfectivo.t}); }
      }
    } else {
      cont++;
      if(inhEfectivo){
        if(inhEfectivo.t==='feria'){ feriasMap[inhEfectivo.n]=(feriasMap[inhEfectivo.n]||0)+1; }
        else if(inhEfectivo.t!=='finde'){ const s=ds(actual); if(!feriados.find(x=>x.f===s)) feriados.push({f:s,n:inhEfectivo.n,t:inhEfectivo.t}); }
      }
    }
    if(cont<cant) actual=next(actual);
  }
  return {fin:actual, feriados, feriasMap};
}

// Detecta feriados locales que caen DENTRO del rango base→fin
function localesEnRango(base, fin){
  const ini=ds(base), end=ds(fin);
  return FERIADOS_LOCALES.filter(x => x.f >= ini && x.f <= end);
}

function calcular(){
  const zE=document.getElementById('zonaError');
  const zR=document.getElementById('zonaResultado');
  const zD=document.getElementById('zonaDetalle');
  zE.innerHTML=''; zR.innerHTML=''; zD.innerHTML='';

  const fv=document.getElementById('fechaInicio').value;
  const cv=parseInt(document.getElementById('cantDias').value);

  if(!fv){ zE.innerHTML='<div class="alerta err"><span class="alerta-icon">⚠️</span><span>Ingrese la fecha de inicio del plazo.</span></div>'; return; }
  if(!cv||cv<1){ zE.innerHTML='<div class="alerta err"><span class="alerta-icon">⚠️</span><span>Ingrese una cantidad válida de días.</span></div>'; return; }

  const [y,m,d]=fv.split('-').map(Number);
  const base=new Date(y,m-1,d);

  const baseCalc=next(base);  // plazo corre desde el día siguiente
  const rH=calcVenc(baseCalc, cv, 'h');
  const rC=calcVenc(baseCalc, cv, 'c');
  const corrH=Math.round((rH.fin-base)/86400000);
  const corrC=Math.round((rC.fin-base)/86400000);

  function badgeInh(inh){
    if(!inh) return '';
    if(inh.t==='nacional') return '<span class="badge b-nacional">feriado</span>';
    if(inh.t==='nolabor')  return '<span class="badge b-nolabor">no laborable</span>';
    if(inh.t==='feria')    return '<span class="badge b-feria">feria</span>';
    return '<span class="badge" style="background:#f3f4f6;color:#6b7280">inhábil</span>';
  }

  function colHTML(r, tipo, corr){
    const dow=r.fin.getDay();
    const inh=esInhabil(r.fin);
    const cls=tipo==='h'?'col-habil':'col-corrido';
    const lbl=tipo==='h'?'📅 Días hábiles':'🗓 Días corridos';
    return `<div class="res-col ${cls}">
      <div class="res-col-hd">${lbl}</div>
      <div class="res-col-body">
        <div class="res-fecha-grande">${fmt(r.fin)}</div>
        <div class="res-dia-txt">${DIAS_L[dow]} ${badgeInh(inh)}</div>
        <div class="res-dias-cnt"><span>${cv}</span> día${cv>1?'s':''} · <span>${corr}</span> corrido${corr>1?'s':''}</div>
      </div>
    </div>`;
  }

  zR.innerHTML=`<div class="res-grid2">${colHTML(rH,'h',corrH)}${colHTML(rC,'c',corrC)}</div>`;

  let det='';

  // Alerta si vencimiento hábil cae en inhábil
  const inhH=esInhabil(rH.fin);
  if(inhH){
    const q=inhH.t==='feria'?'feria judicial':
             inhH.t==='nolabor'?'día no laborable':
             inhH.t==='finde'?'fin de semana':'feriado';
    det+=`<div class="alerta warn"><span class="alerta-icon">⚠️</span><span><b>Hábiles:</b> el vencimiento cae en ${q}. Verifique traslado al primer día hábil siguiente.</span></div>`;
  }

  // Feriados nacionales/no-laborables que cayeron en el plazo hábil
  if(rH.feriados.length>0){
    const rows=rH.feriados.map(x=>{
      const [fy,fm2,fd2]=x.f.split('-').map(Number);
      const d2=new Date(fy,fm2-1,fd2);
      const b=x.t==='nolabor'
        ? '<span class="badge b-nolabor">no laborable</span>'
        : '<span class="badge b-nacional">nacional</span>';
      return `<div class="det-row">
        <span class="det-nombre">${x.n}</span>
        <span class="det-meta">${DIAS_C[d2.getDay()]} ${pad(fd2)}/${pad(fm2)}${b}</span>
      </div>`;
    }).join('');
    det+=`<div class="detalle-card"><div class="det-hd">Inhábiles en el plazo hábil</div>${rows}</div>`;
  }

  // Ferias dentro del plazo hábil
  if(Object.keys(rH.feriasMap).length>0){
    const rows=Object.entries(rH.feriasMap).map(([n,c])=>
      `<div class="det-row"><span class="det-nombre">${n}</span><span class="det-meta">${c} día${c>1?'s':''}<span class="badge b-feria">feria</span></span></div>`
    ).join('');
    det+=`<div class="detalle-card"><div class="det-hd">Ferias en el plazo hábil</div>${rows}
      <div style="font-size:12px;color:var(--texto2);padding-top:9px;margin-top:4px;border-top:1px solid var(--borde)">
        Los días de feria no son computados como hábiles procesales.
      </div>
    </div>`;
  }

  // ── NOTA FERIADOS LOCALES (Goya / Paso de los Libres / Corrientes capital) ──
  // Tomamos el rango más largo (corridos) para no perder ninguno
  const finMax = rC.fin > rH.fin ? rC.fin : rH.fin;
  const locales = localesEnRango(base, finMax);
  if(locales.length > 0){
    // Agrupar por localidad
    const porLoc = {};
    locales.forEach(x => {
      if(!porLoc[x.loc]) porLoc[x.loc]=[];
      porLoc[x.loc].push(x);
    });
    const items = Object.entries(porLoc).map(([loc, dias])=>{
      const fechas = dias.map(x=>{
        const [fy,fm2,fd2]=x.f.split('-').map(Number);
        const d2=new Date(fy,fm2-1,fd2);
        return DIAS_C[d2.getDay()]+' '+pad(fd2)+'/'+pad(fm2);
      }).join(', ');
      return `<div style="margin-bottom:6px;font-size:13px;line-height:1.5">
        <b>${loc}:</b> ${fechas}
      </div>`;
    }).join('');
    det+=`<div class="alerta local">
      <span class="alerta-icon">📍</span>
      <div>
        <div style="font-weight:700;margin-bottom:5px">Feriados locales en este período</div>
        ${items}
        <div style="font-size:12px;margin-top:4px;opacity:0.85">Si la causa tramita en esa localidad, ese día podría no ser hábil. Verifique la acordada correspondiente.</div>
      </div>
    </div>`;
  }

  zD.innerHTML=det;
  setTimeout(function(){
    var el=document.getElementById('zonaResultado');
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }, 100);
}
</script>

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
